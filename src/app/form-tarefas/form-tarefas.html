<div class="container mt-4">
  <h2>Task Form</h2>
  <div>
    <!-- CRUD: Fields for creating/editing tasks -->
    <!-- VALIDATION: Required fields with visual feedback -->
    <div class="mb-3">
      <label for="title" class="form-label">Title: <span class="text-danger">*</span></label>
      <input 
        type="text" 
        [(ngModel)]="task().title" 
        id="title" 
        name="title"
        class="form-control" 
        [class.is-invalid]="errors()['title']"
        placeholder="Enter title"
        required>
      @if (errors()['title']) {
        <div class="invalid-feedback">{{errors()['title']}}</div>
      }
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description: <span class="text-danger">*</span></label>
      <textarea 
        [(ngModel)]="task().description" 
        id="description" 
        name="description"
        class="form-control" 
        [class.is-invalid]="errors()['description']"
        placeholder="Enter description"
        rows="3"
        required></textarea>
      @if (errors()['description']) {
        <div class="invalid-feedback">{{errors()['description']}}</div>
      }
    </div>

    <!-- RELATIONSHIP: Select that connects Tasks with Categories -->
    <!-- FUNCTIONALITY: Manipulate two entities simultaneously -->
    <div class="mb-3">
      <label for="category" class="form-label">Category: <span class="text-danger">*</span></label>
      <select 
        [(ngModel)]="task().categoryId" 
        id="category" 
        name="category"
        class="form-control"
        [class.is-invalid]="errors()['category']"
        required>
        <option value="">Select a category</option>
        @for(category of categories(); track category.id) {
          <option [value]="category.id.toString()">{{category.name}}</option>
        }
      </select>
      @if (errors()['category']) {
        <div class="invalid-feedback">{{errors()['category']}}</div>
      }
    </div>

    <div class="mb-3">
      <label for="priority" class="form-label">Priority (1-5): <span class="text-danger">*</span></label>
      <input 
        type="number" 
        [(ngModel)]="task().priority" 
        id="priority" 
        name="priority"
        class="form-control" 
        [class.is-invalid]="errors()['priority']"
        min="1" 
        max="5"
        placeholder="1-5"
        required>
      @if (errors()['priority']) {
        <div class="invalid-feedback">{{errors()['priority']}}</div>
      }
      <small class="form-text text-muted">Enter a value between 1 (lowest) and 5 (highest priority)</small>
    </div>

    <div class="mb-3">
      <div class="form-check">
        <input 
          type="checkbox" 
          [(ngModel)]="task().completed" 
          id="completed"
          name="completed"
          class="form-check-input">
        <label class="form-check-label" for="completed">
          Completed
        </label>
      </div>
    </div>

    <!-- CRUD: Buttons to save (Create/Update) -->
    <button class="btn btn-primary me-3" (click)="save()">{{actionButton}}</button>
    <!-- SPA NAVIGATION: Button to go back -->
    <button class="btn btn-secondary" (click)="goBack()">Back</button>
  </div>
</div>
