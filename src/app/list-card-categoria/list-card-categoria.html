<div class="container mt-4">
  <h2 class="mb-4 text-center">Category List</h2>

  <div class="row gy-3">
    @for (category of categories(); track category.id) {
      <div class="col-md-4">
        <div class="card shadow">
          <div class="card-body">
            <h5 class="card-title">{{ category.name }}</h5>
            <p class="card-text">{{ category.description }}</p>
            <p class="card-text">
              <strong>Color:</strong> 
              <span class="badge" [style.background-color]="category.color" [style.color]="getContrastColor(category.color)">
                {{category.color}}
              </span>
            </p>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center text-muted">No categories registered.</p>
    }
  </div>
</div>
