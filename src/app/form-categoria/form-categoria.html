<div class="container mt-4">
  <h2>{{actionButton}} Categoria</h2>
  
  <form (ngSubmit)="save()">
    <!-- VALIDAÇÃO: Campos obrigatórios com feedback visual -->
    <div class="mb-3">
      <label for="name" class="form-label">Nome: <span class="text-danger">*</span></label>
      <input 
        type="text" 
        [(ngModel)]="category().name" 
        id="name" 
        name="name" 
        class="form-control"
        [class.is-invalid]="errors()['name']"
        required>
      @if (errors()['name']) {
        <div class="invalid-feedback">{{errors()['name']}}</div>
      }
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Descrição: <span class="text-danger">*</span></label>
      <textarea 
        [(ngModel)]="category().description" 
        id="description" 
        name="description" 
        class="form-control"
        [class.is-invalid]="errors()['description']"
        rows="3"
        required></textarea>
      @if (errors()['description']) {
        <div class="invalid-feedback">{{errors()['description']}}</div>
      }
    </div>

    <div class="mb-3">
      <label for="color" class="form-label">Cor:</label>
      <input type="color" [(ngModel)]="category().color" id="color" name="color" class="form-control form-control-color">
    </div>

    <div class="mb-3">
      <button type="submit" class="btn btn-primary me-2">{{actionButton}}</button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">Voltar</button>
    </div>
  </form>
</div>
