<div class="container mt-4">
  <h2 class="mb-4 text-center">Complete Task List</h2>

  <!-- BUSINESS FUNCTIONALITY: Integrated display with relationship -->
  <div class="row gy-3">
    @for (task of tasks(); track task.id) {
      <div class="col-md-4">
        <!-- RELATIONSHIP: Card with category color -->
        <div class="card shadow" [style.border-left]="'5px solid ' + getCategoryColor(task.categoryId)">
          <div class="card-body">
            <h5 class="card-title">{{ task.title }}</h5>
            <p class="card-text">{{ task.description }}</p>
            
            <!-- RELATIONSHIP: Display category with custom color -->
            <div class="mb-2">
              <strong>Category:</strong> 
              <span class="badge" [style.background-color]="getCategoryColor(task.categoryId)" [style.color]="getContrastColor(getCategoryColor(task.categoryId))">
                {{ getCategoryName(task.categoryId) }}
              </span>
            </div>
            
            <!-- BUSINESS FUNCTIONALITY: Badges with colors based on priority -->
            <div class="row">
              <div class="col-6">
                <p class="card-text mb-1">
                  <strong>Priority:</strong> 
                  <span class="badge" [ngClass]="{
                    'bg-danger': task.priority >= 4,
                    'bg-warning': task.priority === 3,
                    'bg-info': task.priority === 2,
                    'bg-success': task.priority === 1
                  }">
                    {{ task.priority }}
                  </span>
                </p>
              </div>
              <div class="col-6">
                <p class="card-text mb-1">
                  <strong>Status:</strong> 
                  <span class="badge" [ngClass]="task.completed ? 'bg-success' : 'bg-secondary'">
                    {{ task.completed ? 'Completed' : 'Pending' }}
                  </span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center text-muted">No tasks registered.</p>
    }
  </div>
</div>
