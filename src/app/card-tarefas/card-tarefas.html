<div class="card shadow">
  <div class="card-body">
    <h5 class="card-title">{{task.title}}</h5>
    <p class="card-text">{{task.description}}</p>
    <p class="card-text"><strong>Category:</strong> {{ getCategoryName(task.categoryId) }}</p>
    <p class="card-text"><strong>Priority:</strong> {{task.priority}}</p>
    <p class="card-text"><strong>Status:</strong> {{task.completed ? 'Completed' : 'Pending'}}</p>
  </div>
</div>
