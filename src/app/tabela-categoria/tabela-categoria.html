<div class="container">
  <h2>Categories Table</h2>

  @if(categoryList().length > 0) {
    <table class="table table-striped table-hover">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>NAME</th>
          <th>DESCRIPTION</th>
          <th>COLOR</th>
          <th colspan="2">ACTION</th>
        </tr>
      </thead>
      <tbody>
        @for(category of categoryList(); track category.id) {
          <tr>
            <td>{{category.id}}</td>
            <td>{{category.name}}</td>
            <td>{{category.description}}</td>
            <td>
              <span class="badge" [style.background-color]="category.color" [style.color]="getContrastColor(category.color)">
                {{category.color}}
              </span>
            </td>
            <td><a class="btn btn-primary" routerLink="/edit-categoria/{{category.id}}">Edit</a></td>
            <td><a class="btn btn-danger" (click)="delete(category.id)">Delete</a></td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <h4>No categories registered!</h4>
  }
</div>
