<div class="container">
  <h2>Tabela de Categorias</h2>

  @if(categoryList().length > 0) {
    <table class="table table-striped table-hover">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>NOME</th>
          <th>DESCRIÇÃO</th>
          <th>COR</th>
          <th colspan="2">AÇÃO</th>
        </tr>
      </thead>
      <tbody>
        @for(category of categoryList(); track category.id) {
          <tr>
            <td>{{category.id}}</td>
            <td>{{category.name}}</td>
            <td>{{category.description}}</td>
            <td>
              <span class="badge" [style.background-color]="category.color" [style.color]="getContrastColor(category.color)">
                {{category.color}}
              </span>
            </td>
            <td><a class="btn btn-primary btn-sm" routerLink="/edit-categoria/{{category.id}}">Editar</a></td>
            <td><a class="btn btn-danger btn-sm" (click)="delete(category.id)">Deletar</a></td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <h4>Não há categorias cadastradas!</h4>
  }
</div>
