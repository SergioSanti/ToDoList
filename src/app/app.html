<!-- System Title -->
<div class="system-header">
    <h1 class="system-title">TaskMaster</h1>
</div>

<!-- Fixed Logout Button (Top Right Corner) -->
<button class="btn btn-logout-fixed" (click)="logout()" type="button" title="Sign Out">
    <span class="logout-icon-fixed">×</span>
</button>

<!-- SPA NAVIGATION: Centered navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary custom-navbar">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <!-- SPA NAVIGATION: Links to different screens -->
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/tabela" routerLinkActive="active">
                        Tasks
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/novo" routerLinkActive="active">
                        New Task
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/tabela-categoria" routerLinkActive="active">
                        Categories
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/novo-categoria" routerLinkActive="active">
                        New Category
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- SPA NAVIGATION: RouterOutlet renders route components -->
<router-outlet />
