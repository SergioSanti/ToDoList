<!-- Título do Sistema -->
<div class="system-header">
    <h1 class="system-title">TaskMaster</h1>
</div>

<!-- Botão de Logout Fixo (Canto Superior Direito) -->
<button class="btn btn-logout-fixed" (click)="logout()" type="button" title="Sair">
    <span class="logout-icon-fixed">×</span>
</button>

<!-- NAVEGAÇÃO SPA: Barra de navegação centralizada -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary custom-navbar">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <!-- NAVEGAÇÃO SPA: Links para diferentes telas -->
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/tabela" routerLinkActive="active">
                        Tarefas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/novo" routerLinkActive="active">
                        Nova Tarefa
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/tabela-categoria" routerLinkActive="active">
                        Categorias
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/novo-categoria" routerLinkActive="active">
                        Nova Categoria
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- NAVEGAÇÃO SPA: RouterOutlet renderiza componentes das rotas -->
<router-outlet />
